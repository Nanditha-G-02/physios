<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- ?v=3: browsers cache tab icons for a long time; a new value makes them fetch the new logo -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=3" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=3" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0C0E" />
    <meta
      name="description"
      content="RawBot Studio, the Operating System for Physical Intelligence: teach a robot by demonstration, curate the data, train vision-language-action policies and run them on the arm under supervision."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>RawBot Studio</title>
    <script>
      // apply the saved light/dark theme before the first paint (see ThemeToggle.js)
      try { if (localStorage.getItem('rawbot.theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
